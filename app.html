<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عيادتي — لوحة العيادة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark"><i class="ti ti-heartbeat"></i></div>
      <div><b>عيادتي</b><small id="brand-clinic">—</small></div>
    </div>
    <div class="nav-label">القائمة الرئيسية</div>
    <div class="nav-item" data-page="dashboard"><i class="ti ti-layout-dashboard"></i> لوحة التحكم</div>
    <div class="nav-item" data-page="appointments"><i class="ti ti-calendar-event"></i> المواعيد</div>
    <div class="nav-item" data-page="patients"><i class="ti ti-users"></i> المرضى</div>
    <div class="nav-item" data-page="invoices"><i class="ti ti-file-invoice"></i> الفواتير</div>
    <div class="nav-item" data-page="inventory"><i class="ti ti-packages"></i> المخزون</div>
    <div class="nav-item" data-page="pharmacy"><i class="ti ti-prescription"></i> الصيدلية</div>
    <div class="nav-label">الإدارة</div>
    <div class="nav-item" data-page="reports"><i class="ti ti-chart-bar"></i> التقارير</div>
    <div class="nav-item" data-page="staff"><i class="ti ti-id-badge-2"></i> الموظفون</div>
    <div class="nav-item" data-page="settings"><i class="ti ti-settings"></i> الإعدادات</div>
    <div class="nav-label">عام</div>
    <a class="nav-item" id="booking-link" href="/book.html" target="_blank"><i class="ti ti-world"></i> صفحة الحجز العامة</a>
    <div class="nav-item" id="logout"><i class="ti ti-logout-2"></i> تسجيل الخروج</div>
    <div class="me">
      <div class="avatar" id="me-av">—</div>
      <div style="line-height:1.35"><div style="font-size:13px;font-weight:600" id="me-name">—</div><div style="font-size:11px;color:var(--muted)" id="me-role">—</div></div>
    </div>
  </aside>

  <main class="main">
    <section class="page" id="page-dashboard"></section>
    <section class="page" id="page-appointments"></section>
    <section class="page" id="page-patients"></section>
    <section class="page" id="page-patient"></section>
    <section class="page" id="page-consult"></section>
    <section class="page" id="page-invoices"></section>
    <section class="page" id="page-inventory"></section>
    <section class="page" id="page-pharmacy"></section>
    <section class="page" id="page-reports"></section>
    <section class="page" id="page-staff"></section>
    <section class="page" id="page-employee"></section>
    <section class="page" id="page-employeeForm"></section>
    <section class="page" id="page-settings"></section>
  </main>
</div>

<button id="lang-toggle" class="lang-toggle" title="English / عربي">EN</button>

<div id="notif-widget" class="notif-widget">
  <button id="notif-bell" class="notif-bell" aria-label="الإشعارات" title="الإشعارات">
    <i class="ti ti-bell"></i>
    <span class="notif-count" id="notif-count" hidden>0</span>
  </button>
  <div class="notif-panel hidden" id="notif-panel">
    <div class="notif-head"><b>الإشعارات</b><span class="link" id="notif-readall">تعليم الكل كمقروء</span></div>
    <div class="notif-list" id="notif-list"><div class="empty">—</div></div>
  </div>
</div>

<div id="modal-root"></div>

<script src="/assets/api.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/pages.js"></script>
<script src="/assets/forms.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
