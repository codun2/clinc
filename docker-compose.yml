# عيادتي — clinic management: static site (nginx) + Laravel API + MySQL
# One command runs everything: docker compose up -d
name: clinic-system
services:
  clinic-web:
    image: nginx:alpine
    container_name: clinic-web
    restart: unless-stopped
    ports:
      - "8093:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./.nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [clinic-net]

  clinic-db:
    image: mysql:8.0
    container_name: clinic-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: clinic
    ports:
      - "3394:3306"
    volumes:
      - clinic-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [clinic-net]

  clinic-api:
    build: ./api
    container_name: clinic-api
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_NAME: "Ayadati"
      APP_ENV: production
      APP_KEY: "base64:n5VrjDll3xonAaLbsfwflS0w4rM3NXTvaZ+NqknU3uU="
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8094"
      APP_LOCALE: ar
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: mysql
      DB_HOST: clinic-db
      DB_PORT: "3306"
      DB_DATABASE: clinic
      DB_USERNAME: root
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      SUPER_ADMIN_EMAIL: "owner@clinic.sa"
      SUPER_ADMIN_PASSWORD: "Owner2026!"
    volumes:
      - ./api:/app
    ports:
      - "8094:8000"
    depends_on:
      clinic-db:
        condition: service_healthy
    networks: [clinic-net]

volumes:
  clinic-db-data:

networks:
  clinic-net:
